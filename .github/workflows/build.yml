
name: Build jar

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build Forge mod
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          elif [ -f ./gradlew.bat ]; then
            echo "Linux icin gradlew wrapper eksik veya yanlis yuklenmis."
            exit 1
          else
            echo "HATA: gradlew dosyasi bulunamadi."
            ls -la
            exit 1
          fi

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MooshGFsTornado-JAR
          path: build/libs/*.jar
          if-no-files-found: error
